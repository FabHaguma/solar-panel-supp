version: "3.8"
services:
  frontend_solar_panel_supp:
    image: frontend_solar_panel_supp:${SOLPAN_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend_solar_panel_supp
    networks:
      - caddy_network
      - application
  backend_solar_panel_supp:
    image: backend_solar_panel_supp:${SOLPAN_TAG:-local}
    build: .
    restart: unless-stopped
    environment:
      SOLPAN_USER: ${SOLPAN_USER:?Set SOLPAN_USER in .env}
      SOLPAN_PASSWORD: ${SOLPAN_PASSWORD:?Set SOLPAN_PASSWORD in .env}
      SOLPAN_ORIGIN: https://solpan.haguma.com
    volumes:
      - solpan_data:/data
    networks:
      - application
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  caddy_network:
    external: true
    name: caddy_network
  application:
    internal: true
volumes:
  solpan_data:
    name: solar_panel_supp_data
