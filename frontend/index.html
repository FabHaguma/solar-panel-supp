<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#122630">
  <title>Solar supplier checks</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=3">
  <script type="module" src="/assets/js/main.js?v=3"></script>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand">
        <span class="solar-mark" aria-hidden="true"></span>
        <div><h1>Solar supplier checks</h1><p>Kigali, Rwanda</p></div>
      </div>
      <button class="button header-button" id="add-shop" disabled>+ Add shop</button>
    </div>
  </header>
  <nav class="shell section-nav" aria-label="Work areas">
    <div class="section-tabs">
      <a class="section-tab" id="panels-tab" href="/" aria-current="page">Panels &amp; shops</a>
      <a class="section-tab" id="components-tab" href="#components">Components</a>
    </div>
    <a class="button export-link" href="/api/v1/export" download>Download JSON</a>
  </nav>
  <main>
    <div class="shell layout">
    <section class="directory" aria-labelledby="shops-heading">
      <div class="directory-head">
        <h2 id="shops-heading">Shops</h2>
        <p id="directory-progress" class="muted" aria-live="polite"></p>
        <label for="search" class="visually-hidden">Search shops, brands or models</label>
        <input id="search" type="search" placeholder="Search shops, brands or models" autocomplete="off">
        <label for="visit-filter" class="visually-hidden">Filter shops by visit status</label>
        <select id="visit-filter">
          <option value="all">All shops</option>
          <option value="unvisited">To visit</option>
          <option value="visited">Visited</option>
          <option value="owner">Owner contact pending</option>
        </select>
        <details class="nearby-tools">
          <summary>Nearby shops</summary>
          <div class="nearby-controls">
            <button type="button" class="button" id="use-location">Use my location</button>
            <label class="visually-hidden" for="nearby-origin">Saved starting shop</label>
            <select id="nearby-origin"><option value="">Start from a saved shop</option></select>
            <label class="visually-hidden" for="nearby-radius">Distance limit</label>
            <select id="nearby-radius" disabled>
              <option value="">Any distance</option>
              <option value="1">Within 1 km</option>
              <option value="3">Within 3 km</option>
              <option value="5">Within 5 km</option>
              <option value="10">Within 10 km</option>
            </select>
            <button type="button" class="button quiet" id="clear-location" hidden>Clear distance sort</button>
            <p class="muted" id="nearby-status" aria-live="polite"></p>
          </div>
        </details>
      </div>
      <nav id="shops" aria-label="Supplier shops"><p class="muted panel-message">Loading shops…</p></nav>
    </section>
    <section class="workspace" id="workspace" aria-label="Selected shop">
      <p class="muted panel-message">Loading supplier data…</p>
    </section>
    </div>
    <section class="shell components-page" id="components-page" aria-labelledby="components-heading" hidden>
      <div class="component-toolbar">
        <div class="section-heading">
          <div>
            <h2 id="components-heading">Components</h2>
            <p class="muted" id="component-progress" aria-live="polite"></p>
          </div>
          <button class="button primary" id="add-component" disabled>+ Add component</button>
        </div>
        <div class="component-filters">
          <label for="component-search" class="visually-hidden">Search components</label>
          <input id="component-search" type="search" placeholder="Search components or vendors" autocomplete="off">
          <label for="component-category" class="visually-hidden">Filter components by category</label>
          <select id="component-category"><option value="">All categories</option></select>
          <label for="component-vendor" class="visually-hidden">Filter components by shop or vendor</label>
          <select id="component-vendor"><option value="">All shops and vendors</option></select>
        </div>
      </div>
      <div id="component-list"><p class="muted panel-message">Loading components…</p></div>
    </section>
  </main>
  <footer class="shell site-footer">
    <p>Built by <a href="https://www.tech.haguma.com/">HagumaTech</a>, powered by <a href="https://www.webyacu.com/">WebYacu</a></p>
  </footer>
  <p id="flash" class="flash" role="status" hidden></p>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <header class="dialog-head">
        <h2 id="editor-title"></h2>
        <button class="button quiet icon-button" type="button" data-close aria-label="Close form">×</button>
      </header>
      <div id="editor-fields" class="dialog-fields"></div>
      <p class="form-error" id="editor-error" role="alert" hidden></p>
      <footer class="dialog-actions">
        <button class="button quiet" type="button" data-close>Cancel</button>
        <button class="button primary" id="save" type="submit">Save</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
